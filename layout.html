<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Initial Layout — Markdown Visualizer</title>

  <!-- Prism CSS for TypeScript highlighting -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.css" rel="stylesheet" />

  <!-- Basic styling -->
  <style>
    :root{
      --bg:#0f1115;
      --card:#0b0c0f;
      --muted:#9aa4b2;
      --accent:#7dd3fc;
      --panel:#0b0f14;
      --max-width:1100px;
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family:Inter, "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;
      background:linear-gradient(180deg,#071018 0%, #0b1220 100%);
      color:#e6eef6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:24px;
      box-sizing:border-box;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
      display:grid;
      grid-template-columns:260px 1fr;
      gap:20px;
      align-items:start;
    }

    aside{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.03);
      padding:16px;
      border-radius:10px;
      height:calc(100vh - 64px);
      overflow:auto;
      position:sticky;
      top:24px;
    }
    aside h2{margin:0 0 8px 0;font-size:14px;color:var(--accent)}
    .toc{list-style:none;padding:0;margin:0}
    .toc li{margin:6px 0}
    .toc a{color:var(--muted);text-decoration:none;font-size:13px}
    .toc a:hover{color:#fff;text-decoration:underline}

    main{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      border:1px solid rgba(255,255,255,0.03);
      padding:20px;
      border-radius:10px;
      min-height:80vh;
      overflow:auto;
      max-height:calc(100vh - 64px);
    }

    header.page-head{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:18px;
    }
    header.page-head h1{
      margin:0;
      font-size:18px;
      letter-spacing:0.2px;
    }
    header.page-head .meta{
      color:var(--muted);
      font-size:13px;
    }

    section.chapter{
      margin-bottom:28px;
      padding-bottom:18px;
      border-bottom:1px dashed rgba(255,255,255,0.03);
    }

    section.chapter h2{
      margin:0 0 8px 0;
      font-size:16px;
      color:var(--accent);
    }

    .chapter .subheading{
      color:var(--muted);
      font-size:13px;
      margin-bottom:8px;
    }

    /* Markdown content */
    .md-content{
      font-size:15px;
      line-height:1.5;
      color:#dbe9f6;
    }
    .md-content p{margin:0 0 10px 0}
    .md-content ul{margin:6px 0 12px 20px}
    .md-content ol{margin:6px 0 12px 20px}
    .md-content pre{
      background: #071422;
      border:1px solid rgba(255,255,255,0.03);
      padding:12px;
      border-radius:8px;
      overflow:auto;
      margin:12px 0;
    }
    .md-content code{background:rgba(255,255,255,0.02);padding:2px 6px;border-radius:6px;font-size:90%}

    /* Mermaid container */
    .mermaid{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      padding:8px;
      border-radius:6px;
      overflow:auto;
      margin:12px 0;
    }

    /* small helper */
    .controls{
      margin-left:auto;
      display:flex;
      gap:8px;
    }
    .btn{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);
      padding:6px 10px;
      border-radius:8px;
      font-size:13px;
      cursor:pointer;
    }
    .btn:hover{color:#fff}

    @media (max-width:980px){
      .container{grid-template-columns:1fr; padding-bottom:40px;}
      aside{position:relative;height:auto;max-height:220px}
      main{max-height:none}
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <aside aria-label="Table of contents">
      <h2>Chapters</h2>
      <ul id="toc" class="toc"><li>Loading...</li></ul>
      <div style="height:12px"></div>
      <div style="border-top:1px solid rgba(255,255,255,0.02);padding-top:12px;margin-top:12px;color:var(--muted);font-size:12px">
        Source: <br />
        <code style="background:none;padding:0;border-radius:0;color:var(--accent)">ai_context/Initial-layout.md</code>
        <div style="margin-top:6px">Rendered with Mermaid & Prism.</div>
      </div>
    </aside>

    <main>
      <header class="page-head">
        <div>
          <h1>Initial Layout — Markdown Visualizer</h1>
          <div class="meta">Visualizes chapters, diagrams (Mermaid) and TypeScript blocks from <code>ai_context/Initial-layout.md</code></div>
        </div>
        <div class="controls">
          <button id="reloadBtn" class="btn" title="Reload file">Reload</button>
          <button id="openRaw" class="btn" title="Open raw markdown in new tab">Open Raw</button>
        </div>
      </header>

      <div id="content" class="md-content">
        <p>Loading and parsing <code>ai_context/Initial-layout.md</code>…</p>
      </div>
    </main>
  </div>

  <!-- Libraries: marked (markdown), prism (syntax highlighting), mermaid (diagrams) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script>
    // Configuration
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    // Helpers for parsing the non-standard markdown in ai_context/Initial-layout.md
    function preprocessRawMD(md) {
      // Normalize line endings
      const lines = md.replace(/\\r\\n/g, '\\n').replace(/\\r/g, '\\n').split('\\n');
      const out = [];
      let i = 0;
      const n = lines.length;

      const isSentinel = (ln) => {
        if (!ln) return false;
        const t = ln.trim();
        return /^Chapter\\s+[IVXLCDM]+\\s*-/.test(t)
          || /^TypeScript$/i.test(t)
          || /^Explanatory Notes$/i.test(t)
          || /^Gameplay Flowchart$/i.test(t)
          || /^ER Diagram$/i.test(t)
          || /^Now let/i.test(t)
          || /^Let me continue/i.test(t)
          || /^Copy Code$/i.test(t)
          || /^Flowchart/ig.test(t);
      };

      while (i < n) {
        const line = lines[i];
        // Handle mermaid blocks indicated by a bare 'mermaid' line
        if (line.trim().toLowerCase() === 'mermaid') {
          // skip the 'mermaid' line
          i++;
          // skip optional "Copy Code"
          if (i < n && /^\\s*Copy Code\\s*$/i.test(lines[i])) i++;
          // collect until next sentinel (or empty line followed by known heading)
          const block = [];
          while (i < n && !isSentinel(lines[i])) {
            block.push(lines[i]);
            i++;
          }
          // Trim leading/trailing empty lines
          while (block.length && block[0].trim() === '') block.shift();
          while (block.length && block[block.length - 1].trim() === '') block.pop();
          if (block.length) {
            out.push('```mermaid');
            out.push(...block);
            out.push('```');
            out.push('');
          } else {
            // nothing collected, noop
          }
          continue;
        }

        // Handle "mermaid" when there's "ER Diagram" / "Gameplay Flowchart" preceding the label
        if (/^erDiagram\\b|^flowchart\\b|^flowchart TD\\b/i.test(line.trim()) && (i > 0 && lines[i-1].trim().toLowerCase() === 'mermaid')) {
          // already handled by previous block logic; skip it here
          out.push(line);
          i++;
          continue;
        }

        // Handle typescript blocks signaled by 'typescript' lines
        if (line.trim().toLowerCase() === 'typescript') {
          i++;
          if (i < n && /^\\s*Copy Code\\s*$/i.test(lines[i])) i++;
          const block = [];
          while (i < n && !isSentinel(lines[i])) {
            block.push(lines[i]);
            i++;
          }
          while (block.length && block[0].trim() === '') block.shift();
          while (block.length && block[block.length - 1].trim() === '') block.pop();
          if (block.length) {
            out.push('```typescript');
            out.push(...block);
            out.push('```');
            out.push('');
          }
          continue;
        }

        // For normal lines, pass through
        out.push(line);
        i++;
      }

      return out.join('\\n');
    }

    // Split markdown into chapters based on lines like "Chapter II - The World"
    function splitChapters(md) {
      const lines = md.split('\\n');
      const chapters = [];
      let current = null;

      for (let i = 0; i < lines.length; i++) {
        const ln = lines[i];
        const m = ln.match(/^Chapter\\s+([IVXLCDM]+)\\s*-\\s*(.*)/);
        if (m) {
          // start new chapter
          if (current) chapters.push(current);
          current = { titleRaw: ln.trim(), title: m[0].trim(), contentLines: [] };
        } else {
          if (!current) {
            // content before first chapter - append to a "Prologue" section if needed
            if (!chapters.length || chapters[chapters.length - 1].title !== 'Prologue') {
              current = { titleRaw: 'Prologue', title: 'Prologue', contentLines: [] };
            }
            current.contentLines.push(ln);
          } else {
            current.contentLines.push(ln);
          }
        }
      }
      if (current) chapters.push(current);
      return chapters;
    }

    // Render processed markdown into chapter sections
    async function render() {
      const contentEl = document.getElementById('content');
      const tocEl = document.getElementById('toc');

      contentEl.innerHTML = '<p>Fetching markdown…</p>';
      try {
        const resp = await fetch('ai_context/Initial-layout.md');
        if (!resp.ok) throw new Error('Failed to fetch markdown: ' + resp.status);
        const raw = await resp.text();

        // Preprocess to convert mermaid/typescript indicators to fenced code blocks.
        const pre = preprocessRawMD(raw);

        // Split into chapters
        const chapters = splitChapters(pre);

        // Build TOC
        tocEl.innerHTML = '';
        chapters.forEach((ch, idx) => {
          const id = 'chapter-' + idx;
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '#' + id;
          a.textContent = ch.title;
          li.appendChild(a);
          tocEl.appendChild(li);
        });

        // Render chapters
        const htmlParts = [];
        for (let idx = 0; idx < chapters.length; idx++) {
          const ch = chapters[idx];
          const id = 'chapter-' + idx;
          // Render markdown of the chapter content (title separated)
          const mdForChapter = '# ' + ch.title + '\\n\\n' + ch.contentLines.join('\\n');
          const rendered = marked.parse(mdForChapter);
          // We will post-process mermaid codeblocks after injecting to the DOM.
          htmlParts.push('<section class="chapter" id="' + id + '">');
          htmlParts.push(rendered);
          htmlParts.push('</section>');
        }

        contentEl.innerHTML = htmlParts.join('\\n');

        // Replace <pre><code class="language-mermaid">...</code></pre> with <div class="mermaid">...</div>
        // and then initialize mermaid for those blocks.
        const preMermaidNodes = contentEl.querySelectorAll('pre > code.language-mermaid, pre > code.language-mermaid\\n');
        const mermaidDivs = [];
        preMermaidNodes.forEach(code => {
          const pre = code.parentElement;
          const txt = code.textContent || '';
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = txt;
          pre.parentElement.replaceChild(div, pre);
          mermaidDivs.push(div);
        });

        // Run mermaid on each div
        if (mermaidDivs.length) {
          // mermaid.init accepts a parent element or NodeList
          mermaid.init(undefined, mermaidDivs);
        }

        // Highlight TypeScript blocks with Prism
        Prism.highlightAll();

        // Scroll to top
        window.scrollTo(0,0);

      } catch (err) {
        console.error(err);
        contentEl.innerHTML = '<p style="color:#ffb4b4">Error loading file: ' + (err.message || err) + '</p>';
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', () => {
      render();
    });
    document.getElementById('openRaw').addEventListener('click', () => {
      window.open('ai_context/Initial-layout.md', '_blank');
    });

    // Initial render
    render();
  </script>
</body>
</html>
